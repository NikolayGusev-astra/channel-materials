<!doctype html><html><head><meta charset="utf-8"><title>Speculative decoding: anatomy</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f0;color:#18212b;font-family:Arial,sans-serif}svg{width:1280px;height:720px;display:block}.small{font-size:16px;fill:#53606d}.label{font-size:22px;font-weight:700;fill:#152330}.token{font:700 22px Arial;fill:#fff}.machine{fill:#fff;stroke:#263947;stroke-width:3}.pipe{fill:none;stroke:#738491;stroke-width:8;stroke-linecap:round}.accent{fill:#f06b38}.blue{fill:#2878bb}.green{fill:#238c68}.red{fill:#c74747}.muted{fill:#9aa6ad}.word{font-size:24px;font-weight:700;fill:#fff}.readout{font-size:20px;font-weight:700;fill:#263947}</style></head><body><svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"><rect width="1280" height="720" fill="#f6f5f0"/><text x="64" y="70" font-size="34" font-weight="700" fill="#152330">Спекулятивное декодирование</text><text x="64" y="105" class="small">Малая модель предлагает блок. Большая проверяет его одним проходом.</text><text x="64" y="167" class="label">Обычный режим</text><rect x="64" y="188" width="270" height="92" rx="18" class="machine"/><text x="92" y="223" class="label">Target model</text><text x="92" y="254" class="small">1 токен за проход</text><path d="M334 234H430" class="pipe"/><circle cx="465" cy="234" r="30" class="accent"/><text x="451" y="242" class="token">1</text><text x="510" y="242" class="small">следующий токен</text><text x="64" y="350" class="label">Спекулятивный режим</text><rect x="64" y="376" width="275" height="110" rx="18" class="machine"/><text x="92" y="414" class="label">Draft model</text><text x="92" y="447" class="small">дешево предлагает блок</text><path d="M339 431H432" class="pipe"/><rect x="432" y="388" width="300" height="86" rx="14" fill="#e7eef3" stroke="#738491" stroke-width="2"/><text x="452" y="418" class="small">предложение</text><g id="tokens"></g><path d="M732 431H820" class="pipe"/><rect x="820" y="376" width="330" height="110" rx="18" class="machine"/><text x="850" y="414" class="label">Target model</text><text x="850" y="447" class="small">проверяет весь блок</text><g id="result"></g><text x="64" y="556" class="readout" id="status"></text><text x="64" y="594" class="small" id="detail"></text><rect x="64" y="634" width="1152" height="18" rx="9" fill="#dce2e5"/><rect id="progress" x="64" y="634" width="0" height="18" rx="9" fill="#f06b38"/><text x="64" y="690" class="small">Draft-предложения не обязательны к принятию: после первого расхождения target продолжает сам.</text></svg><script>
const F=Number(new URLSearchParams(location.search).get('f')||0);
const N=40, phase=F%N;
const target=['С','читает','отчёт','и','ищет','дату','договора','.'];
const draft=['С','читает','письмо','и','ищет','срок','оплаты','.'];
const accepted=phase<8?(phase%4)+1:2;
const mismatch=phase>=8;
const tokens=document.getElementById('tokens');let s='';
for(let i=0;i<4;i++){const ok=i<accepted;const txt=draft[(phase+i)%draft.length];s+=`<g><rect x="${446+i*70}" y="430" width="64" height="34" rx="8" fill="${ok?'#238c68':(mismatch&&i===accepted?'#c74747':'#2878bb')}"/><text x="${478+i*70}" y="454" text-anchor="middle" class="word" style="font-size:16px">${txt.trim()||'·'}</text></g>`}
tokens.innerHTML=s;
const result=document.getElementById('result');let r='';for(let i=0;i<4;i++){const acceptedNow=mismatch?i<accepted:i<accepted;const tx=acceptedNow?draft[(phase+i)%draft.length]:target[(phase+i)%target.length];r+=`<rect x="${836+i*78}" y="409" width="72" height="40" rx="9" fill="${acceptedNow?'#238c68':'#f06b38'}"/><text x="${872+i*78}" y="436" text-anchor="middle" class="word" style="font-size:17px">${tx.trim()||'·'}</text>`}result.innerHTML=r;
document.getElementById('status').textContent=mismatch?`Target принял ${accepted} совпавших токена; на третьем предложении заменил draft продолжением.`:`Draft предложил 4 токена; target проверяет блок. Принято: ${accepted}.`;
document.getElementById('detail').textContent=mismatch?'Проверка блока заменяет несколько отдельных проходов, если совпадения окупают цену draft.':'Зелёный: совпало. Синий: кандидат на проверке. Оранжевый: токен target.';
document.getElementById('progress').setAttribute('width',String(1152*(phase+1)/N));
</script></body></html>
