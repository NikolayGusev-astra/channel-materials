    <text x="810" y="148" text-anchor="middle" fill="#8090bb" font-size="15">MAIN MODEL</text>
    <text x="810" y="178" text-anchor="middle" fill="#e8ecff" font-size="18" font-weight="650">модель агента</text>
    <text x="810" y="204" text-anchor="middle" fill="#8090bb" font-size="14">проверка, решение, следующий шаг</text>
  </g>
  <line x1="930" y1="170" x2="1010" y2="170" stroke="#5070ff" stroke-width="2.5" marker-end="url(#arr)"/>

  <g>
    <rect x="1015" y="130" width="150" height="80" rx="12" fill="#3050ff" opacity="0.15"/>
    <rect x="1015" y="130" width="150" height="80" rx="12" fill="none" stroke="#5070ff" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="1090" y="165" text-anchor="middle" fill="#e8ecff" font-size="16" font-weight="650">ответ</text>
