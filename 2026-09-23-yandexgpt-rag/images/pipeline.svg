    <text x="160" y="204" text-anchor="middle" fill="#8090bb" font-size="14">bge-m3, чанки базы знаний</text>
  </g>
  <line x1="280" y1="170" x2="360" y2="170" stroke="#5070ff" stroke-width="2.5" marker-end="url(#arr)"/>

  <g>
    <rect x="365" y="110" width="240" height="120" rx="12" fill="#1A2240" stroke="#5070ff" stroke-width="2"/>
    <text x="485" y="148" text-anchor="middle" fill="#5070ff" font-size="15">GENERATOR 8B</text>
    <text x="485" y="178" text-anchor="middle" fill="#e8ecff" font-size="18" font-weight="650">YandexGPT-5-Lite</text>
    <text x="485" y="204" text-anchor="middle" fill="#8090bb" font-size="14">чанки → текст с цитатами</text>
  </g>
  <line x1="605" y1="170" x2="685" y2="170" stroke="#5070ff" stroke-width="2.5" marker-end="url(#arr)"/>

