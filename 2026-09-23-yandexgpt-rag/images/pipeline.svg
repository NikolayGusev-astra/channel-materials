<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/><stop offset="1" stop-color="#12182a"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5070ff"/>
    </marker>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <g stroke="#1A2240" stroke-width="1" opacity="0.6">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200"/>
    <path d="M60 0 V420 M120 0 V420 M180 0 V420 M240 0 V420 M300 0 V420 M360 0 V420 M420 0 V420 M480 0 V420 M540 0 V420 M600 0 V420 M660 0 V420 M720 0 V420 M780 0 V420 M840 0 V420 M900 0 V420 M960 0 V420 M1020 0 V420 M1080 0 V420 M1140 0 V420"/>
  </g>
  <text x="600" y="52" text-anchor="middle" fill="#e8ecff" font-size="26" font-weight="700">Пайплайн: лёгкий генератор в агентском контуре</text>

  <g>
    <rect x="40" y="110" width="240" height="120" rx="12" fill="#1A2240" stroke="#506090" stroke-width="1.5"/>
    <text x="160" y="148" text-anchor="middle" fill="#8090bb" font-size="15">RETRIEVAL</text>
