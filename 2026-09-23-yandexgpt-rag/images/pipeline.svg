  <rect x="365" y="280" width="240" height="86" rx="10" fill="none" stroke="#5070ff" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>
  <text x="485" y="308" text-anchor="middle" fill="#5070ff" font-size="14" font-weight="650">дёшево и локально</text>
  <text x="485" y="330" text-anchor="middle" fill="#8090bb" font-size="13">4.6 GB VRAM, ~29 tok/s</text>
  <text x="485" y="350" text-anchor="middle" fill="#8090bb" font-size="13">контекст не тратится у main-модели</text>

  <text x="600" y="405" text-anchor="middle" fill="#506090" font-size="13">hermes-agent.ru · третья часть цикла «Домашний Perplexity»</text>
